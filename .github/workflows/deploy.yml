name: Build, test, deploy

# Bypasses Vercel's native Git integration, which is currently disconnected
# (the project is still linked to the repo's pre-transfer identity,
# Dekayd/YULMixLaBedaine, and reconnecting it needs a YULmix org owner — see
# docs/11-live-environment.md). This workflow deploys straight from CI using
# the official Vercel CLI instead, and is also the CI gate that was missing
# in front of every deploy.
#
# One-time setup (see docs/07-development-setup.md#deploying), done by
# someone with access to the yulm-ix Vercel account, run locally, never
# pasted to an AI assistant:
#   gh secret set VERCEL_TOKEN     # from vercel.com/account/tokens
#   gh secret set VERCEL_ORG_ID    # team_2Dq8V0ST1KNITgzIndZyh3IX
#   gh secret set VERCEL_PROJECT_ID  # prj_hAUPlcsCKxYEW6URcw08AuyE8G8J
#
# Database migrations (see docs/07-development-setup.md#database-migrations):
# when a push to main brings new files under supabase/migrations/, the
# `backup` and `migrate` jobs dump production, then `supabase db push` it,
# before the Vercel deploy. One-time setup, done by someone with access to
# the "YULmix - La Bedaine" Supabase project, run locally, never pasted to
# an AI assistant, and BEFORE merging any migration (without them the
# backup job fails, and a failed backup blocks the deploy):
#   scripts/setup-supabase-token.sh production
#                                             # creates and checks the scoped token, with the
#                                             # permissions in scripts/supabase-ci-tokens.json,
#                                             # and stores it (gh secret set --env
#                                             # supabase-production). See docs/07-development-setup.md.
#                                             # Set as an environment secret, not a repo
#                                             # secret: the "supabase-production" environment
#                                             # is branch-restricted to main, so no workflow
#                                             # run on any other branch can read this token.
#   gh secret set SUPABASE_BACKUP_PASSPHRASE  # any long random string; also keep it in a
#                                             # password manager: it is the only way to
#                                             # decrypt a backup artifact
# No database password is needed: with only the access token, the Supabase
# CLI logs in through a temporary role it creates via the Management API.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# One production deploy at a time; queue rather than cancel one mid-flight.
# Each PR's previews get their own group, so a new push cancels that PR's
# stale preview build instead of piling up.
#
# The group covers the whole run, so backup → migrate → deploy of one push
# finishes before the next push's run starts: two `db push`es never overlap,
# and a newer migration never lands between an older push's migrate and its
# deploy. Don't give backup/migrate a job-level group of their own: a job
# asking for the group its own run already holds would wait forever.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned deliberately, not floating on @latest, so a Vercel CLI release
  # doesn't silently change deploy behaviour. Bump on purpose.
  VERCEL_CLI_VERSION: '59'
  # Same rule for the database tooling.
  SUPABASE_CLI_VERSION: '2.114.0'
  SQUAWK_VERSION: '2.66.0'
  # Not a secret: it is in every Supabase URL the app ships.
  SUPABASE_PROJECT_REF: ceacurlofmasyvhsoska
  PREVIEW_SUPABASE_PROJECT_REF: uacfrldoiixfstigosqv

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint:diff needs the base branch's history to compute which lines
          # this PR actually added (see scripts/lint-diff.mjs).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      # The .ts modules and their use of the generated database types (#201). Vite and Babel
      # strip types without checking them, so this is the only place they are checked.
      - run: npm run typecheck

      - run: npm run test:pricing

      # The whole Jest unit suite (component and lib tests; the RLS suite is excluded by
      # jest.config.js). test:pricing above is a subset, kept as its own step for a clear signal.
      - run: npm test

      # The Edge Functions (supabase/functions/) are Deno, outside the Node toolchain above.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: deno test supabase/functions/

      - run: deno check supabase/functions/*/index.ts

      # Repo-wide, informational only (local/no-literal-ui-strings is a
      # warning — see eslint.config.js for the pre-existing backlog this
      # is tracking, not gating).
      - run: npm run lint

      # Blocking: fails only on NEW hardcoded UI strings introduced by this
      # PR's diff, never on pre-existing ones in a touched file.
      - name: Lint changed files for new hardcoded UI strings
        if: github.event_name == 'pull_request'
        run: npm run lint:diff -- "origin/${{ github.base_ref }}"

  # Replays supabase/migrations/ against an empty, throwaway Postgres on the
  # runner, so a migration that doesn't parse or doesn't apply fails here, in
  # review, instead of on production. This job never touches the production
  # database (no Supabase credentials are passed to it); `migrate` below does,
  # and only after this job has passed on the same commit.
  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Starts only the local Postgres container and applies every migration.
      - run: supabase db start

      - run: supabase migration list --local

      # The Preview demo seed writes through the app's own functions, so a migration that changes
      # a write path can break it without breaking anything else (#275). `supabase db start`
      # above already loaded seed.sql, so load only the generated demo data into the migrated
      # database; psql stops at the first error.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Demo seed loads on the migrated schema
        run: |
          npm run db:seed:generate
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -o /dev/null \
            -f supabase/seeds/preview.generated.sql

      # src/lib/database.types.ts is generated from this schema (`npm run db:types`, #201): a
      # migration that changes a table, view or function must come with the regenerated file,
      # or typecheck would be checking the app against a schema that no longer exists.
      - name: Database types match the migrations
        run: |
          # `gen types` pulls the postgres-meta image from public.ecr.aws, which sometimes
          # answers "toomanyrequests: Rate exceeded" (#253). Retry the generation only: the
          # diff below runs once, so a real mismatch still fails at once without retries.
          for attempt in 1 2 3 4 5; do
            if supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::supabase gen types failed 5 times (registry rate limit?)"
              exit 1
            fi
            delay=$((10 * 2 ** (attempt - 1)))
            echo "gen types failed (attempt $attempt); retrying in ${delay}s"
            sleep "$delay"
          done
          if ! diff -u src/lib/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error file=src/lib/database.types.ts::Out of date with supabase/migrations/: run npm run db:types and commit the result."
            exit 1
          fi

  # Decides whether this run has database work to do. Runs alongside
  # build-and-test, so it adds nothing to the critical path of an ordinary
  # frontend-only change; everything database-related below is skipped
  # unless it says "true".
  #
  # On a pull request: the migration files this PR adds or changes (squawk
  # lints only those, never the whole history).
  #
  # On a push to main: whether supabase/migrations/ changed since the last
  # push run that fully succeeded, NOT just since the previous commit. That
  # covers the cases a plain `before..after` diff would miss: a migrate that
  # failed (the next push, even a frontend-only one, retries it before
  # deploying), and a queued run that GitHub cancelled because a newer push
  # arrived (its migration still gets applied by the newer run). If the
  # history can't be read, it answers "true": an unneeded `db push` is a
  # no-op, a missed one ships code against a schema that isn't there.
  changes:
    name: Detect migration changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list
    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}
      files: ${{ steps.detect.outputs.files }}
      app: ${{ steps.detect.outputs.app }}
      functions: ${{ steps.detect.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff supabase/migrations/
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A doc/Markdown-only diff needs no new app deploy. Deliberately narrow: anything
          # outside docs/**  and *.md anywhere (including root-level README.md etc.) counts as
          # an app change, so this only ever skips a deploy for genuinely doc-only PRs/pushes —
          # it never skips one for a workflow, schema, or source change.
          is_app_change() {
            echo "$1" | grep -vE '^docs/|\.md$' | grep -q .
          }

          if [ "$EVENT_NAME" = pull_request ]; then
            files=$(git diff --diff-filter=ACMR --name-only "origin/$BASE_REF...HEAD" -- 'supabase/migrations/*.sql' | tr '\n' ' ')
            # db push never re-runs a file production already recorded, so
            # editing an applied migration silently does nothing. Only a
            # migration whose push failed (never applied) may be fixed in place.
            git diff --diff-filter=MDR --name-only "origin/$BASE_REF...HEAD" -- supabase/migrations/ \
              | while read -r f; do
                  echo "::warning file=$f::Edits/deletes an existing migration. Fine only if it was never applied to production; otherwise add a new migration instead."
                done
            changed=$([ -n "${files// /}" ] && echo true || echo false)
            all_files=$(git diff --diff-filter=ACMR --name-only "origin/$BASE_REF...HEAD")
            app=$(is_app_change "$all_files" && echo true || echo false)
            functions=$(git diff --name-only "origin/$BASE_REF...HEAD" -- supabase/functions/ supabase/config.toml | grep -q . && echo true || echo false)
          else
            last=$(gh run list --workflow deploy.yml --branch main --event push --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
              echo "Comparing against $last, the last fully successful push to main."
              files=$(git diff --name-only "$last" HEAD -- supabase/migrations/ | tr '\n' ' ')
              changed=$([ -n "${files// /}" ] && echo true || echo false)
              all_files=$(git diff --name-only "$last" HEAD)
              app=$(is_app_change "$all_files" && echo true || echo false)
              functions=$(git diff --name-only "$last" HEAD -- supabase/functions/ supabase/config.toml | grep -q . && echo true || echo false)
            else
              echo "::notice::No usable last-successful run; assuming migrations and app changes may be pending."
              files=''
              changed=true
              app=true
              functions=true
            fi
          fi
          echo "migrations=$changed" | tee -a "$GITHUB_OUTPUT"
          echo "files=$files" | tee -a "$GITHUB_OUTPUT"
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"
          echo "functions=$functions" | tee -a "$GITHUB_OUTPUT"

  # Flags migrations that lock or break things (dropped/renamed columns,
  # NOT NULL without a default, …) and comments the findings on the PR.
  # Blocking. Rules that only matter for large, busy tables are turned off
  # in .squawk.toml; to accept a finding on purpose, put
  # `-- squawk-ignore <rule>` above the statement and say why in the PR.
  squawk:
    name: Lint migrations (squawk)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # squawk's PR comment
    steps:
      - uses: actions/checkout@v4

      - uses: sbdchd/squawk-action@f972c01c35289cf7611464dae9a214bb84cce5e4 # v2.2.0
        with:
          version: ${{ env.SQUAWK_VERSION }}
          config: .squawk.toml
          files: ${{ needs.changes.outputs.files }}
          fail-on-violations: 'true'
          # A fork PR's token can't comment; squawk still fails the check.
          upload-to-github: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  # Everything production holds, taken right before `migrate` changes it.
  # The data includes auth.users and payments, and artifacts on this public
  # repo are downloadable by any signed-in GitHub user, so the dump is
  # encrypted before upload. Decrypt with:
  #   gpg -d supabase-backup-<sha>.tar.gz.gpg | tar -xzf -
  backup:
    name: Back up production database
    needs: [build-and-test, migrations, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    # Branch-restricted to main (see the one-time setup comment above) so
    # SUPABASE_ACCESS_TOKEN, an account-wide credential, isn't readable by a
    # workflow run on any other branch.
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dump roles, schema and data
        run: |
          mkdir backup
          supabase db dump --linked --role-only -f backup/roles.sql
          supabase db dump --linked -f backup/schema.sql
          supabase db dump --linked --data-only --use-copy -f backup/data.sql
          supabase migration list --linked > backup/migration-list.txt
          ls -l backup

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.SUPABASE_BACKUP_PASSPHRASE }}
        run: |
          [ -n "$PASSPHRASE" ] || { echo "::error::SUPABASE_BACKUP_PASSPHRASE is not set"; exit 1; }
          tar -C backup -czf - . \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                --passphrase-fd 3 --output "supabase-backup-$GITHUB_SHA.tar.gz.gpg" 3<<<"$PASSPHRASE"
          rm -rf backup

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.sha }}
          path: supabase-backup-${{ github.sha }}.tar.gz.gpg
          if-no-files-found: error
          # The maximum GitHub allows for a public repo. Long enough to notice a
          # bad migration after a quiet stretch; take a manual dump if a
          # backup needs to outlive it.
          retention-days: 90
          compression-level: 0 # already compressed and encrypted

  # Applies every migration production hasn't recorded yet. Each file runs in
  # its own transaction, so a failing file leaves production as it was
  # before that file, and the deploy below does not run.
  migrate:
    name: Apply migrations to production
    needs: [changes, backup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what will run
        run: supabase db push --linked --dry-run

      - name: supabase db push
        run: supabase db push --linked --yes

      - run: supabase migration list --linked

  # Brings the Preview Supabase project (ADR 0015) up to main's migrations, so preview builds
  # don't break on a column only production has (#104). Pending migrations only: Preview's fake
  # data and sign-ins stay. If Preview records a migration main doesn't have (it was reset from a
  # branch whose migration never merged), `db push` refuses, and the script resets Preview from
  # main instead; the job summary says so. scripts/preview-db.mjs refuses any URL that isn't
  # Preview. PREVIEW_DB_URL is a repo secret (Preview's session pooler connection string).
  #
  # Off production's path: nothing needs this job, so a failure never blocks migrate or deploy.
  # It does make the run fail, so the next push to main counts migrations as pending again
  # (see `changes`) and retries it, with a no-op backup and migrate for production.
  preview-db:
    name: Apply migrations to Preview
    needs: [migrations, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    # The Reset Preview DB workflow's group: one Preview write at a time, queued, never cancelled.
    concurrency:
      group: preview-db-reset
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The drift fallback generates the preview seed.
      - run: npm ci

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: npm run db:preview:push -- --yes
        env:
          PREVIEW_DB_URL: ${{ secrets.PREVIEW_DB_URL }}

  # Preview's counterpart of `functions`: the Edge Functions on the Preview project, after its
  # database has the migrations. No email trigger setup: Preview sends no real email.
  preview-functions:
    name: Deploy Edge Functions to Preview
    needs: [changes, preview-db]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && (needs.changes.outputs.functions == 'true' || needs.changes.outputs.migrations == 'true')
      && (needs.changes.outputs.migrations != 'true' || needs.preview-db.result == 'success')
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: preview-db-reset
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - run: supabase functions deploy --project-ref "$PREVIEW_SUPABASE_PROJECT_REF"

  # The custom access token hook (« Voir comme », ADR 0025) is Auth configuration, not schema:
  # `db push` never sets it, and a reset of the database leaves it as it was. So this job enables
  # it as code, on EVERY push to main (and by hand with "Run workflow" on main): the call is
  # idempotent, so a hook switched off in a dashboard is repaired by the next push. It is its own
  # job, after the migrations only: a failure here (a token missing a permission) blocks nothing else, and a failed function deploy doesn't block it. The script
  # refuses when the project's database lacks the hook function.
  # Never enable or disable the hook by hand; see docs/07-development-setup.md.
  preview-access-token-hook:
    name: Enable the access token hook (Preview)
    needs: [changes, preview-db]
    if: >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && (needs.preview-db.result == 'success' || needs.preview-db.result == 'skipped')
      && (github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.migrations != 'true' || needs.preview-db.result == 'success')
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: preview-db-reset
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable the custom access token hook
        run: scripts/enable-access-token-hook.sh "$PREVIEW_SUPABASE_PROJECT_REF"

  # Deploys supabase/functions/ to production when they (or config.toml) changed, after any
  # pending migration has applied, then points the email trigger at the deployed function
  # (ADR 0016: the URL is per environment, so it lives in private.settings, not in a migration).
  #
  # One-time setup, done by a maintainer, run locally, never pasted to an AI assistant, and
  # BEFORE merging the first function (this job fails until it is done, so no registration is
  # ever recorded as a dry run in production and silently never emailed):
  #   supabase secrets set --project-ref ceacurlofmasyvhsoska RESEND_API_KEY=re_...
  #                        # a Resend "Sending access" key restricted to yulmix.com
  # Then re-run the failed job from the Actions tab if it ran first.
  functions:
    name: Deploy Edge Functions
    needs: [build-and-test, changes, migrate]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build-and-test.result == 'success'
      && needs.changes.result == 'success'
      && needs.changes.outputs.functions == 'true'
      && (needs.changes.outputs.migrations != 'true' || needs.migrate.result == 'success')
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Two different failures, reported separately: a token that can't list secrets (it needs
      # "Edge Function Secrets: Read", see docs/07-development-setup.md) is not a missing key.
      - name: Require RESEND_API_KEY
        run: |
          if ! secrets=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" -o json); then
            echo "::error::Could not list the production project's secrets (see the error above). Run scripts/setup-supabase-token.sh production (permissions: scripts/supabase-ci-tokens.json)."
            exit 1
          fi
          jq -e 'any(.[]; .name == "RESEND_API_KEY")' <<<"$secrets" > /dev/null \
            || { echo "::error::RESEND_API_KEY is not set on the production project. See the one-time setup above this job."; exit 1; }

      # verify_jwt per function comes from supabase/config.toml.
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Point the email trigger at the function
        run: |
          supabase db query --linked "INSERT INTO private.settings (key, value)
            VALUES ('email_function_url', 'https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/send-party-email')
            ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value"

  # Production's counterpart of preview-access-token-hook (same rules; touches only the hook fields).
  production-access-token-hook:
    name: Enable the access token hook (production)
    needs: [changes, migrate]
    if: >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
      && (github.event_name == 'workflow_dispatch'
          || needs.changes.outputs.migrations != 'true' || needs.migrate.result == 'success')
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable the custom access token hook
        run: scripts/enable-access-token-hook.sh "$SUPABASE_PROJECT_REF"

  # Runs on every push to main that touches more than docs/**Markdown, migration
  # or not. The explicit condition is needed because GitHub skips a job whose
  # `needs` were skipped unless its `if:` says otherwise, and `migrate` is
  # skipped on every frontend-only push. `!cancelled()` (not `always()`, which
  # also fires on cancellation) lifts that default; the rest puts back what
  # must hold:
  #   - doc-only push                  → no deploy, nothing to ship
  #   - no migrations pending          → deploy (migrate/backup skipped)
  #   - migrations pending, migrate ok → deploy
  #   - migrations pending, backup or migrate failed/skipped → no deploy
  #   - change detection itself failed → no deploy (fail closed)
  deploy:
    name: Deploy to production
    needs: [build-and-test, changes, migrate]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build-and-test.result == 'success'
      && needs.changes.result == 'success'
      && needs.changes.outputs.app == 'true'
      && (needs.changes.outputs.migrations != 'true' || needs.migrate.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}

      # Pulls the project's Production env vars (VITE_SUPABASE_URL,
      # VITE_SUPABASE_ANON_KEY, …) from Vercel itself — nothing Supabase-
      # related needs to be duplicated as a GitHub secret.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  preview:
    name: Deploy preview
    needs: [build-and-test, changes]
    # Same-repo PRs only. A fork PR can't see repo secrets anyway (GitHub
    # withholds them from pull_request runs triggered by forks), so this
    # just turns that into a clean "skipped" instead of a confusing failed
    # check on someone else's contribution. Also skips for a doc-only PR —
    # see `changes` (job "Detect migration changes") for what counts.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on the PR
        run: |
          gh pr comment "$PR_NUMBER" --body "Preview: $PREVIEW_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
